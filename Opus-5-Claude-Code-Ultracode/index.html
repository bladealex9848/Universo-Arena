   * @param {string} clave "blanco" | "amarillo" | "naranja" | "rojo"
   * @returns {void}
   */
  function aplicarColorSol(clave) {
    const paleta = COLORES_SOL[clave];
    if (!paleta) return;
    estado.colorSol = clave;
    sol.material.emissiveColor.set(paleta.nucleo[0], paleta.nucleo[1], paleta.nucleo[2]);
    sol.materialHalo.emissiveColor.set(paleta.corona[0], paleta.corona[1], paleta.corona[2]);
    luzSolar.diffuse.set(paleta.luz[0], paleta.luz[1], paleta.luz[2]);
    sol.corona.color1.set(paleta.corona[0], paleta.corona[1], paleta.corona[2], 0.75);
    sol.corona.color2.set(paleta.corona[0] * 0.9, paleta.corona[1] * 0.6, paleta.corona[2] * 0.35, 0.55);
    sol.corona.colorDead.set(paleta.corona[0] * 0.16, paleta.corona[1] * 0.06, 0, 0);
    // El preset oficial (si cargó) se tiñe igual, para que no desentone: como
    // usa degradados de color, se recolorean sus paradas (color1/color2 del
    // sistema serían ignorados mientras existan gradientes).
    sistemasPreset.forEach(function (sistema) {
      const paradas = typeof sistema.getColorGradients === "function"
        ? (sistema.getColorGradients() || []) : [];
      paradas.forEach(function (parada) {
        if (parada.baseA === undefined) return;
        parada.color1.set(paleta.corona[0] * parada.baseA, paleta.corona[1] * parada.baseA,
          paleta.corona[2] * parada.baseA, parada.color1.a);
        if (parada.color2 && parada.baseB !== undefined) {
          parada.color2.set(paleta.corona[0] * parada.baseB, paleta.corona[1] * parada.baseB,
            paleta.corona[2] * parada.baseB, parada.color2.a);
        }
      });
    });
    ui.colorSolVal.textContent = paleta.nombre;
    Array.prototype.forEach.call(ui.paletaSol.querySelectorAll("button"), function (boton) {
      boton.setAttribute("aria-pressed", String(boton.dataset.color === clave));
    });
  }

  const FRAMES_TRANSICION = 48;      // ~0.8 s de transición entre vistas
  let animacionVista = null;         // Animatable de la transición en curso

  /**
   * Resuelve UNA sola vez (al cambiar de vista) la malla que la cámara seguirá,
   * para no hacer una búsqueda por nombre en cada frame.
   * @param {string|null} nombre Nombre del cuerpo ("Sol", "Tierra"…).
   * @returns {BABYLON.AbstractMesh|null}
   */
  function nodoDeCuerpo(nombre) {
    if (!nombre) return null;
    if (nombre === "Sol") return sol.malla;
    if (nombre === "Halley") return halley.nucleo;
    const cuerpo = cuerpos.find(function (c) { return c.datos.nombre === nombre; });
    return cuerpo ? cuerpo.nucleo : null;
  }

  /**
   * Cambia de vista con una transición suave (CubicEase) de radio, alpha y
   * beta. En las vistas de seguimiento solo se anima la distancia: el target
   * se interpola en el bucle de render, de modo que el usuario NUNCA pierde
   * el control del zoom ni del ángulo.
   * @param {string} clave Clave de VISTAS.
   * @returns {void}
   */
  function aplicarVista(clave) {
    const vista = VISTAS[clave];
    if (!vista) return;
    estado.tiempoEnVista = 0;
    estado.nodoSeguido = vista.seguir ? nodoDeCuerpo(vista.seguir) : null;
    estado.longitudSeguida = null;
    ui.enfoque.textContent = vista.etiqueta;

    /* Los primeros planos NO bajan lowerRadiusLimit (el spec lo fija en 30):
       se hace TELEOBJETIVO reduciendo el campo de visión. La cámara sigue a 32
       unidades de la Tierra, pero con fov 0.16 rad ocupa media pantalla. */

    const suavizado = new BABYLON.CubicEase();
    suavizado.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);

    /**
     * Construye una animación de dos claves con suavizado.
     * (Se usa el patrón documentado `new Animation` + `setKeys` +
     * `beginDirectAnimation`: `Animation.CreateAndStartAnimation` devuelve un
     * *Animatable*, que NO expone `setEasingFunction`.)
     * @param {string} propiedad Propiedad de la cámara a animar.
     * @param {number|BABYLON.Vector3} desde Valor inicial.
     * @param {number|BABYLON.Vector3} hasta Valor final.
     * @param {number} tipo Constante ANIMATIONTYPE_* de BABYLON.Animation.
     * @returns {BABYLON.Animation}
     */
    function crearAnimacion(propiedad, desde, hasta, tipo) {
      const animacion = new BABYLON.Animation(
        "vista_" + propiedad, propiedad, 60, tipo,
        BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT
      );
      animacion.setKeys([
        { frame: 0, value: desde },
        { frame: FRAMES_TRANSICION, value: hasta },
      ]);
      animacion.setEasingFunction(suavizado);
      return animacion;
    }

    /* Encuadre por el lado iluminado: si la vista sigue a un cuerpo, la cámara
       se coloca entre el Sol y el cuerpo (dirección −posición, porque el Sol
       está en el origen) para ver su hemisferio diurno y no un disco negro.
       En ArcRotateCamera la posición relativa al objetivo es
       (cosα·sinβ, cosβ, sinα·sinβ), de ahí α = atan2(−z, −x). */
    let alphaDestino = vista.alpha;
    if (vista.seguir && vista.seguir !== "Sol") {
      const posicionCuerpo = estado.nodoSeguido ? estado.nodoSeguido.getAbsolutePosition() : null;
      if (posicionCuerpo && posicionCuerpo.length() > 1) {
        alphaDestino = Math.atan2(-posicionCuerpo.z, -posicionCuerpo.x) + 0.55;
      }
    }
    if (typeof alphaDestino !== "number") alphaDestino = camara.alpha;
    while (alphaDestino - camara.alpha > Math.PI) alphaDestino -= TAU;
    while (camara.alpha - alphaDestino > Math.PI) alphaDestino += TAU;

    const animaciones = [
      crearAnimacion("radius", camara.radius, vista.radio, BABYLON.Animation.ANIMATIONTYPE_FLOAT),
      crearAnimacion("alpha", camara.alpha, alphaDestino, BABYLON.Animation.ANIMATIONTYPE_FLOAT),
      crearAnimacion("beta", camara.beta, vista.beta, BABYLON.Animation.ANIMATIONTYPE_FLOAT),
      crearAnimacion("fov", camara.fov, vista.fov, BABYLON.Animation.ANIMATIONTYPE_FLOAT),
    ];
    if (!vista.seguir) {
      // Vistas fijas: el objetivo vuelve al Sol de forma suave.
      animaciones.push(crearAnimacion(
        "target", camara.target.clone(), BABYLON.Vector3.Zero(),
        BABYLON.Animation.ANIMATIONTYPE_VECTOR3
      ));
    }

    if (animacionVista) animacionVista.stop();   // no se solapan dos transiciones
    animacionVista = escena.beginDirectAnimation(
      camara, animaciones, 0, FRAMES_TRANSICION, false
    );
  }

  /**
   * Cablea todos los controles del panel con su efecto en la escena.
   * @returns {void}
   */
  function configurarUI() {
    // ── Sección 1: tiempo y velocidad ──
    ui.velGlobal.addEventListener("input", function () {
      estado.velocidadGlobal = parseFloat(ui.velGlobal.value);
      ui.velGlobalVal.textContent = estado.velocidadGlobal.toFixed(1) + "×";
      actualizarRelleno(ui.velGlobal);
    });
    ui.velOrbital.addEventListener("input", function () {
      estado.velocidadOrbital = parseFloat(ui.velOrbital.value);
      ui.velOrbitalVal.textContent = estado.velocidadOrbital.toFixed(1) + "×";
      actualizarRelleno(ui.velOrbital);
    });
    ui.btnPausa.addEventListener("click", function () {
      estado.pausado = !estado.pausado;
      ui.btnPausa.textContent = estado.pausado ? "▶ Reanudar" : "⏸ Pausar";
      ui.btnPausa.classList.toggle("pausado", estado.pausado);
      ui.btnPausa.setAttribute("aria-pressed", String(estado.pausado));
    });

    // ── Sección 2: visualización ──
    // Los seis interruptores comparten una única función de aplicación, así que
    // no puede haber combinaciones incoherentes (p. ej. la órbita del cometa
    // reapareciendo con el cometa oculto).
    [ui.chkOrbitas, ui.chkNombres, ui.chkCometa, ui.chkCola, ui.chkCinturon, ui.chkNebulosas]
      .forEach(function (control) {
        control.addEventListener("change", aplicarVisibilidad);
      });
    ui.selVista.addEventListener("change", function () { aplicarVista(ui.selVista.value); });
    ui.tamRelativo.addEventListener("input", function () {
      estado.tamanoRelativo = parseFloat(ui.tamRelativo.value);
      ui.tamRelativoVal.textContent = estado.tamanoRelativo.toFixed(1) + "×";
      actualizarRelleno(ui.tamRelativo);
      aplicarTamanoRelativo(estado.tamanoRelativo);
    });

    // ── Sección 3: estética ──
    ui.selTema.addEventListener("change", function () { aplicarTema(ui.selTema.value); });
    ui.chkBloom.addEventListener("change", function () {
      estado.bloom = ui.chkBloom.checked;
      if (tuberia && tuberia.isSupported) tuberia.bloomEnabled = estado.bloom;
      if (capaGlow) capaGlow.isEnabled = estado.bloom;
    });
    ui.paletaSol.addEventListener("click", function (evento) {
      const boton = evento.target.closest("button[data-color]");
      if (boton) aplicarColorSol(boton.dataset.color);
    });

    // ── Panel plegable ──
    ui.btnPlegar.addEventListener("click", function () { plegarPanel(true); });
    ui.btnAbrir.addEventListener("click", function () { plegarPanel(false); });

    // ── Atajos de teclado ──
    window.addEventListener("keydown", function (evento) {
      if (evento.target && /input|select|textarea/i.test(evento.target.tagName)) return;
      const tecla = evento.key.toLowerCase();
      if (tecla === " ") { evento.preventDefault(); ui.btnPausa.click(); }
      else if (tecla === "o") { ui.chkOrbitas.checked = !ui.chkOrbitas.checked; ui.chkOrbitas.dispatchEvent(new Event("change")); }
      else if (tecla === "p") { plegarPanel(!ui.panel.classList.contains("plegado")); }
    });

    /* Sincronización inicial: algunos navegadores (Firefox) restauran los
       valores de los controles al recargar, así que la escena se construye a
       partir del DOM real y no de los valores por defecto del HTML. */
    ui.velGlobal.dispatchEvent(new Event("input"));
    ui.velOrbital.dispatchEvent(new Event("input"));
    ui.tamRelativo.dispatchEvent(new Event("input"));
    ui.chkBloom.dispatchEvent(new Event("change"));
    aplicarVisibilidad();
    aplicarVista(ui.selVista.value);
    aplicarTema(ui.selTema.value);
    [ui.velGlobal, ui.velOrbital, ui.tamRelativo].forEach(actualizarRelleno);
  }

  /**
   * Aplica de una sola vez el estado de los seis interruptores de visualización.
   * Al ser la ÚNICA vía, las dependencias quedan siempre coherentes: la cola y
   * la órbita del cometa dependen del cometa, y las etiquetas del cometa
   * dependen además del interruptor de nombres.
   * @returns {void}
   */
  function aplicarVisibilidad() {
    estado.orbitas = ui.chkOrbitas.checked;
    estado.nombres = ui.chkNombres.checked;
    estado.cometa = ui.chkCometa.checked;
    estado.cola = ui.chkCola.checked;
    estado.cinturon = ui.chkCinturon.checked;
    estado.nebulosas = ui.chkNebulosas.checked;

    lineasOrbita.forEach(function (linea) { linea.setEnabled(estado.orbitas); });
    etiquetas.forEach(function (etiqueta) { etiqueta.setEnabled(estado.nombres); });
    asteroides.forEach(function (roca) { roca.instancia.setEnabled(estado.cinturon); });
    nebulosas.forEach(function (plano) { plano.setEnabled(estado.nebulosas); });

    halley.nucleo.setEnabled(estado.cometa);
    halley.linea.setEnabled(estado.cometa && estado.orbitas);
    halley.etiqueta.setEnabled(estado.cometa && estado.nombres);
    if (estado.cometa) { halley.coma.start(); } else { halley.coma.stop(); halley.coma.reset(); }

    const colaVisible = estado.cometa && estado.cola;
    [halley.colaIones, halley.colaPolvo].forEach(function (cola) {
      if (colaVisible) { cola.start(); } else { cola.stop(); cola.reset(); }
    });
  }

  /**
   * Pliega o despliega el panel de configuración.
   * @param {boolean} plegar true para ocultarlo.
   * @returns {void}
   */
  function plegarPanel(plegar) {
    ui.panel.classList.toggle("plegado", plegar);
    ui.btnAbrir.classList.toggle("visible", plegar);
  }

  configurarUI();
  aplicarColorSol(estado.colorSol);

  /* ═══════════════════════════════════════════════════════════════════════
     16. BUCLE DE ANIMACIÓN (todo escalado por deltaTime)
     ═══════════════════════════════════════════════════════════════════════ */

  /* Vectores temporales reutilizados: cero reservas de memoria por frame. */
  const posicionTemporal = new BABYLON.Vector3();
  const direccionAntiSolar = new BABYLON.Vector3();
  const direccionVelocidad = new BABYLON.Vector3();
  const perpendicularCola = new BABYLON.Vector3();
  const objetivoCamara = new BABYLON.Vector3();
  let tiempoSimulado = 0;
  let acumuladorHUD = 0;
  let factorParticulasAplicado = -1;   // evita reescribir updateSpeed cada frame

  escena.onBeforeRenderObservable.add(function () {
    // deltaTime real en segundos, acotado para que un parón no dé un salto.
    const delta = Math.min(motor.getDeltaTime() / 1000, DELTA_MAXIMO);
    const factorGlobal = estado.pausado ? 0 : estado.velocidadGlobal;
    const factorOrbital = factorGlobal * estado.velocidadOrbital;
    tiempoSimulado += delta * factorGlobal;

    /* Los sistemas de partículas viven en su propia línea temporal: se les
       aplica el mismo factor para que la pausa los congele de verdad y la
       velocidad global los acelere (acotado para no saturar su capacidad). */
    if (factorParticulasAplicado !== factorGlobal) {
      factorParticulasAplicado = factorGlobal;
      const factorParticulas = Math.min(factorGlobal, 3);
      for (let i = 0; i < sistemasAnimados.length; i++) {
        sistemasAnimados[i].sistema.updateSpeed = sistemasAnimados[i].velocidadBase * factorParticulas;
      }
    }

    /* Zoom proporcional al radio usando el propio wheelPrecision del spec: con
       un rango 30–2000 un paso fijo sería inútil en los extremos. */
    camara.wheelPrecision = Math.min(14, Math.max(0.35, 380 / camara.radius));

    // ── Sol: rotación lenta + pulsado de escala 1.0 ↔ 1.05 cada ~3 s ──
    sol.malla.rotation.y += delta * 0.08 * factorGlobal;
    const pulso = 1 + 0.025 + Math.sin(tiempoSimulado * (TAU / 3)) * 0.025;
    sol.malla.scaling.setAll(pulso);
    sol.halo.scaling.setAll(pulso);

    // ── Planetas: Kepler (2.ª ley) + rotación axial propia ──
    for (let i = 0; i < cuerpos.length; i++) {
      const cuerpo = cuerpos[i];
      cuerpo.anomaliaMedia += delta * cuerpo.movimientoMedio * factorOrbital;
      const E = resolverKepler(cuerpo.anomaliaMedia, cuerpo.datos.e);
      posicionEnElipse(E, cuerpo.datos.a, cuerpo.datos.e, cuerpo.pivote.position);
      cuerpo.nucleo.rotation.y += delta * ROTACION_BASE * cuerpo.datos.giro * factorGlobal;
      if (cuerpo.atmosfera) {
        cuerpo.atmosfera.rotation.y += delta * ROTACION_BASE * cuerpo.datos.giro * 0.6 * factorGlobal;
      }
      if (cuerpo.luna) {
        cuerpo.luna.pivote.rotation.y += delta * 1.1 * factorOrbital;
        cuerpo.luna.malla.rotation.y += delta * 0.4 * factorGlobal;
      }
    }

    // ── Cinturón de asteroides ──
    if (estado.cinturon) {
      for (let i = 0; i < asteroides.length; i++) {
        const roca = asteroides[i];
        roca.anomaliaMedia += delta * roca.movimientoMedio * factorOrbital;
        const E = resolverKepler(roca.anomaliaMedia, roca.e, 2);   // e < 0.1: converge en 2
        posicionEnElipse(E, roca.a, roca.e, posicionTemporal);
        // Inclinación propia de cada asteroide (rotación alrededor del eje X).
        const seno = Math.sin(roca.inc), coseno = Math.cos(roca.inc);
        roca.instancia.position.x = posicionTemporal.x;
        roca.instancia.position.y = -posicionTemporal.z * seno;
        roca.instancia.position.z = posicionTemporal.z * coseno;
        roca.instancia.rotation.x += delta * roca.giroX * factorGlobal;
        roca.instancia.rotation.y += delta * roca.giroY * factorGlobal;
      }
    }

    /* ── Cometa Halley: posición, colas y presión de radiación ──
       La ÓRBITA se integra siempre, aunque el cometa esté oculto: la vista
       «Seguir a Halley» debe poder apuntarlo en cualquier momento y no a una
       posición congelada. Lo que sí se salta cuando está oculto es el trabajo
       caro: orientar y alimentar las dos colas. */
    halley.anomaliaMedia += delta * halley.movimientoMedio * factorOrbital;
    const anomaliaHalley = resolverKepler(halley.anomaliaMedia, HALLEY.e);
    posicionEnElipse(anomaliaHalley, HALLEY.a, HALLEY.e, halley.pivote.position);
    halley.nucleo.rotation.y += delta * 0.9 * factorGlobal;

    if (estado.cometa) {
      // Se fuerza el recálculo de la matriz mundo para que la cola use la
      // posición de ESTE frame (y no la del anterior) al orientarse.
      halley.nucleo.computeWorldMatrix(true);
      const posicionMundo = halley.nucleo.getAbsolutePosition();

      /* LA REGLA DE ORO DEL COMETA:
         el Sol está en el ORIGEN, así que el vector que va del Sol al cometa es
         la propia posición del cometa: esa es, exactamente, la dirección
         ANTI-SOLAR hacia la que debe apuntar la cola.
         Se copia a un vector temporal ANTES de normalizar porque
         Vector3.normalize() MUTA el receptor: normalizar la posición del núcleo
         lo teletransportaría a la esfera unidad (el bug clásico del reto).
         Sin `.negate()` ni `.scale(-1)`: la cola huye del Sol, no lo apunta. */
      direccionAntiSolar.copyFrom(posicionMundo).normalize();

      // Dirección de avance (para retrasar la cola de polvo, como en la realidad).
      posicionMundo.subtractToRef(halley.posicionAnterior, direccionVelocidad);
      if (direccionVelocidad.length() > 1e-5) direccionVelocidad.normalize();
      halley.posicionAnterior.copyFrom(posicionMundo);

      // Perpendicular a la dirección anti-solar: producto vectorial con el eje Y,
      // que se reduce a (−z, 0, x). Sirve para abrir la cola en cono SIN desviar
      // su eje respecto al Sol.
      perpendicularCola.set(-direccionAntiSolar.z, 0, direccionAntiSolar.x);
      if (perpendicularCola.lengthSquared() < 1e-6) perpendicularCola.set(1, 0, 0);
      perpendicularCola.normalize();

      // La actividad crece cerca del Sol (presión de radiación ∝ 1/d²).
      const distanciaSol = Math.max(posicionMundo.length(), 1);
      const perihelio = HALLEY.a * (1 - HALLEY.e);
      const actividad = Math.min(1, Math.max(0.12, (perihelio * perihelio) / (distanciaSol * distanciaSol)));

      const colaIones = halley.colaIones;
      colaIones.emitter.copyFrom(posicionMundo);
      /* direction1 es EXACTAMENTE la dirección anti-solar y de módulo 1
         (verificable: su producto escalar con (cometa − Sol) normalizado vale
         1.0). La longitud de la cola la fija minEmitPower/maxEmitPower y NO el
         módulo del vector: así la estela mide decenas de unidades, no miles. */
      colaIones.direction1.copyFrom(direccionAntiSolar);
      colaIones.direction2.copyFrom(direccionAntiSolar);
      colaIones.direction2.x += perpendicularCola.x * 0.06;
      colaIones.direction2.y += perpendicularCola.y * 0.06;
      colaIones.direction2.z += perpendicularCola.z * 0.06;
      colaIones.minEmitPower = 8 + actividad * 10;
      colaIones.maxEmitPower = 16 + actividad * 20;
      colaIones.emitRate = 320 + actividad * 900;

      const colaPolvo = halley.colaPolvo;
      colaPolvo.emitter.copyFrom(posicionMundo);
      // La cola de polvo va también en sentido opuesto al Sol, pero "arrastrada"
      // hacia atrás en la trayectoria: de ahí su curvatura característica.
      colaPolvo.direction1.copyFrom(direccionAntiSolar);
      colaPolvo.direction1.x -= direccionVelocidad.x * 0.35;
      colaPolvo.direction1.y -= direccionVelocidad.y * 0.35;
      colaPolvo.direction1.z -= direccionVelocidad.z * 0.35;
      colaPolvo.direction2.copyFrom(colaPolvo.direction1).scaleInPlace(1.2);
      colaPolvo.minEmitPower = 5 + actividad * 7;
      colaPolvo.maxEmitPower = 11 + actividad * 13;
      colaPolvo.emitRate = 160 + actividad * 420;
    }

    // ── Etiquetas: tamaño adaptado a la distancia para seguir siendo legibles ──
    if (estado.nombres) {
      for (let i = 0; i < etiquetas.length; i++) {
        const etiqueta = etiquetas[i];
        const distancia = BABYLON.Vector3.Distance(camara.position, etiqueta.getAbsolutePosition());
        const escala = Math.min(7, Math.max(0.5, distancia / 120));
        etiqueta.scaling.set(escala, escala, escala);
      }
    }

    // ── Cámara: seguimiento suave del cuerpo elegido ──
    if (estado.nodoSeguido) {
      // Matriz mundo de ESTE frame: sin esto el objetivo iría un frame por
      // detrás y, con teleobjetivo, ese retraso se nota como descentrado.
      estado.nodoSeguido.computeWorldMatrix(true);
      const objetivo = estado.nodoSeguido.getAbsolutePosition();
      if (objetivo) {
        estado.tiempoEnVista += delta;

        /* La cámara ACOMPAÑA al cuerpo en su vuelta alrededor del Sol: se suma
           a `alpha` el incremento de longitud heliocéntrica del cuerpo. Así se
           conserva el ángulo respecto al Sol (el hemisferio iluminado sigue de
           frente aunque el planeta recorra media órbita) y, al ser un
           incremento y no un valor absoluto, el usuario no pierde el control:
           lo que él gire se mantiene encima. */
        if (objetivo.x !== 0 || objetivo.z !== 0) {
          const longitud = Math.atan2(objetivo.z, objetivo.x);
          if (estado.longitudSeguida !== null) {
            let avance = longitud - estado.longitudSeguida;
            while (avance > Math.PI) avance -= TAU;
            while (avance < -Math.PI) avance += TAU;
            camara.alpha += avance;
          }
          estado.longitudSeguida = longitud;
        }
        // Durante la transición se interpola (entrada suave); después el
        // objetivo se fija exactamente al cuerpo para que no quede rezagado.
        if (estado.tiempoEnVista > 1.1) {
          camara.target.copyFrom(objetivo);
        } else {
          objetivoCamara.copyFrom(camara.target);
          const suavidad = Math.min(1, delta * 6);
          camara.target.set(
            objetivoCamara.x + (objetivo.x - objetivoCamara.x) * suavidad,
            objetivoCamara.y + (objetivo.y - objetivoCamara.y) * suavidad,
            objetivoCamara.z + (objetivo.z - objetivoCamara.z) * suavidad
          );
        }
      }
    }

    // ── Panel de información (se refresca 4 veces por segundo, no cada frame) ──
    acumuladorHUD += delta;
    if (acumuladorHUD > 0.25) {
      acumuladorHUD = 0;
      const fps = Math.round(motor.getFps());
      ui.fps.textContent = String(fps);
      ui.fps.className = fps >= 50 ? "bien" : fps >= 25 ? "medio" : "mal";
      ui.objetos.textContent = String(escena.meshes.length);
    }
  });

  /* ═══════════════════════════════════════════════════════════════════════
     17. ARRANQUE: bucle de render, resize y recuperación de contexto
     ═══════════════════════════════════════════════════════════════════════ */

  motor.runRenderLoop(function () {
    escena.render();
  });

  // resize con debounce: cada evento reconstruye los render targets del pipeline.
  let temporizadorResize = 0;
  window.addEventListener("resize", function () {
    clearTimeout(temporizadorResize);
    temporizadorResize = setTimeout(function () { motor.resize(); }, 120);
  });

  // Recuperación elegante si el navegador pierde el contexto WebGL.
  motor.onContextLostObservable.add(function () {
    textoCarga.textContent = "Contexto WebGL perdido; restaurando…";
    capaCarga.classList.remove("oculto");
  });
  motor.onContextRestoredObservable.add(function () {
    capaCarga.classList.add("oculto");
  });

  /**
   * Retira la capa de carga (una sola vez).
   * @returns {void}
   */
  function ocultarCapaCarga() {
    capaCarga.classList.add("oculto");
    ui.objetos.textContent = String(escena.meshes.length);
  }

  escena.executeWhenReady(ocultarCapaCarga);
  // Red de seguridad: si la escena nunca reportara estar lista, la capa de carga
  // no puede quedarse tapando la página para siempre.
  setTimeout(ocultarCapaCarga, 8000);
})();
</script>
</body>
</html>
