<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Celeste — Universo 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: dark; --panel: rgba(8, 14, 29, .84); --line: rgba(151, 180, 255, .28); --accent: #b8cbff; --ink: #edf2ff; }
    body { overflow: hidden; background: #02040b; color: var(--ink); font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #renderCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
    #panel { position: fixed; z-index: 2; right: 18px; top: 18px; width: min(300px, calc(100vw - 36px)); max-height: calc(100vh - 36px); overflow: auto; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 16px 60px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.06); backdrop-filter: blur(16px); }
    #panel::-webkit-scrollbar { width: 6px; } #panel::-webkit-scrollbar-thumb { background: #7687b8; border-radius: 10px; }
    .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 13px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; color: #cddaff; }
    .brand i { width: 9px; height: 9px; border-radius: 50%; background: #dfe9ff; box-shadow: 0 0 12px #91b1ff; }
    .section { border-top: 1px solid rgba(180,200,255,.14); padding-top: 12px; margin-top: 12px; }
    .section h2 { font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: #92a4d7; margin-bottom: 10px; }
    .field { display: grid; gap: 5px; margin: 9px 0; } .field label { display: flex; justify-content: space-between; color: #d9e2ff; }
    output { color: #95b4ff; font-variant-numeric: tabular-nums; } input[type="range"] { width: 100%; accent-color: #9eb8ff; }
    select, button { width: 100%; border: 1px solid rgba(174,197,255,.27); border-radius: 8px; padding: 8px 9px; color: var(--ink); background: rgba(78, 99, 153, .18); font: inherit; }
    button { cursor: pointer; transition: transform .16s, background .16s; } button:hover { background: rgba(126,151,219,.28); } button:active { transform: scale(.98); }
    .checks { display: grid; gap: 8px; } .checks label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #dce6ff; } .checks input { accent-color: #abc1ff; }
    #info { position: fixed; z-index: 2; left: 18px; bottom: 18px; padding: 11px 13px; border: 1px solid rgba(151,180,255,.2); border-radius: 11px; background: rgba(5,9,21,.67); color: #c9d5f5; backdrop-filter: blur(12px); font-size: 12px; } #fps { color: #9dbdff; font-weight: 650; }
    body.classic { --panel: rgba(17, 16, 13, .88); --line: rgba(225, 190, 115, .35); --accent: #f2d18b; } body.dark { --panel: rgba(1, 3, 9, .91); --line: rgba(107, 133, 179, .24); }
    @media (max-width: 600px) { #panel { top: 10px; right: 10px; max-height: 55vh; } #info { left: 10px; bottom: 10px; font-size: 10px; } }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <aside id="panel" aria-label="Configuración del universo">
    <div class="brand"><i></i> Atlas celeste</div>
    <section class="section"><h2>Tiempo y velocidad</h2>
      <div class="field"><label for="globalSpeed">Velocidad global <output id="globalSpeedValue">1.0x</output></label><input id="globalSpeed" type="range" min="0" max="10" step=".1" value="1"></div>
      <div class="field"><label for="orbitSpeed">Velocidad orbital <output id="orbitSpeedValue">1.0x</output></label><input id="orbitSpeed" type="range" min=".1" max="3" step=".1" value="1"></div>
      <button id="pauseButton" type="button">Pausar simulación</button>
    </section>
    <section class="section"><h2>Visualización</h2><div class="checks">
      <label><input id="showOrbits" type="checkbox" checked> Mostrar órbitas</label><label><input id="showLabels" type="checkbox" checked> Mostrar nombres</label><label><input id="showHalley" type="checkbox" checked> Mostrar cometa Halley</label><label><input id="showTail" type="checkbox" checked> Mostrar cola del cometa</label><label><input id="showAsteroids" type="checkbox" checked> Mostrar cinturón de asteroides</label><label><input id="showNebulas" type="checkbox" checked> Mostrar nebulosas</label>
    </div><div class="field"><label for="cameraView">Vista de cámara</label><select id="cameraView"><option value="system">Sistema Solar</option><option value="sun">Sol cercano</option><option value="earth">Tierra</option><option value="saturn">Saturno</option><option value="panorama">Panorámica</option><option value="halley">Halley</option></select></div>
    <div class="field"><label for="planetScale">Tamaño relativo <output id="planetScaleValue">1.0x</output></label><input id="planetScale" type="range" min=".5" max="3" step=".1" value="1"></div></section>
    <section class="section"><h2>Estética</h2>
      <div class="field"><label for="theme">Tema</label><select id="theme"><option value="futuristic">Futurista</option><option value="classic">Clásico</option><option value="dark">Oscuro</option></select></div>
      <div class="checks"><label><input id="showBloom" type="checkbox" checked> Activar bloom y glow</label></div>
      <div class="field"><label for="sunColor">Color del sol</label><select id="sunColor"><option value="yellow">Amarillo</option><option value="white">Blanco</option><option value="orange">Naranja</option><option value="red">Rojo</option></select></div>
    </section>
  </aside>
  <div id="info"><span id="fps">-- FPS</span> · <span id="objects">-- objetos</span><br>Click izq: rotar &nbsp;|&nbsp; Rueda: zoom &nbsp;|&nbsp; Click der: pan</div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
  (() => {
    'use strict';
    /** Datos orbitales estilizados y constantes del sistema. */
    const PLANETS = [
      { name: 'Mercurio', distance: 24, size: 1.25, color: [0.55,0.52,0.48], speed: 1.60, tilt: .03, eccentricity: .14 },
      { name: 'Venus', distance: 33, size: 2.15, color: [0.94,0.57,0.20], speed: -.98, tilt: .08, eccentricity: .07 },
      { name: 'Tierra', distance: 44, size: 2.35, color: [0.12,0.40,0.95], speed: .72, tilt: .12, eccentricity: .04, atmosphere: [0.28,0.64,1] },
      { name: 'Marte', distance: 56, size: 1.72, color: [0.78,0.20,0.10], speed: .55, tilt: .05, eccentricity: .09, atmosphere: [1,.35,.15] },
      { name: 'Júpiter', distance: 78, size: 6.8, color: [0.80,0.53,0.30], speed: .31, tilt: .06, eccentricity: .05, bands: true },
      { name: 'Saturno', distance: 104, size: 5.7, color: [0.86,0.71,0.39], speed: .22, tilt: .11, eccentricity: .06, hasRings: true, ringColor: [0.75,0.66,0.48] },
      { name: 'Urano', distance: 130, size: 3.85, color: [0.36,0.80,0.82], speed: .15, tilt: 1.57, eccentricity: .04 },
      { name: 'Neptuno', distance: 153, size: 3.7, color: [0.12,0.30,0.85], speed: .11, tilt: .09, eccentricity: .03 },
      { name: 'Plutón', distance: 184, size: .95, color: [0.49,0.51,0.55], speed: .075, tilt: .28, eccentricity: .32 }
    ];
    const SUN_COLORS = { white:[1,.94,.78], yellow:[1,.55,.08], orange:[1,.25,.025], red:[1,.035,.01] };
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    const scene = new BABYLON.Scene(engine); scene.clearColor = new BABYLON.Color4(.003,.006,.018,1);
    const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 2.4, 1.05, 180, BABYLON.Vector3.Zero(), scene);
    camera.lowerRadiusLimit = 30; camera.upperRadiusLimit = 2000; camera.wheelPrecision = 3; camera.panningSensibility = 50; camera.attachControl(canvas, true);
    camera.useAutoRotationBehavior = true; camera.autoRotationBehavior.idleRotationSpeed = .03; camera.autoRotationBehavior.idleRotationWaitTime = 2500;
    const hemiLight = new BABYLON.HemisphericLight('luzAmbiente', new BABYLON.Vector3(0,1,0), scene); hemiLight.intensity = .1;
    const sunLight = new BABYLON.PointLight('luzSolar', BABYLON.Vector3.Zero(), scene); sunLight.intensity = 2; sunLight.diffuse = new BABYLON.Color3(1,.95,.85); sunLight.range = 420;
    const state = { globalSpeed:1, orbitSpeed:1, paused:false, size:1, followHalley:false };
    const planets = [], orbitLines = [], asteroids = [], nebulas = [];
    let sun, sunMaterial, sunCorona, halley, halleyTail, bloomPipeline, glowLayer;

    /** Crea una textura de texto para las etiquetas billboard. */
    function makeLabelTexture(text) { const texture = new BABYLON.DynamicTexture('etiqueta_'+text, {width:512,height:128}, scene, true); const ctx=texture.getContext(); ctx.clearRect(0,0,512,128); ctx.font='600 42px system-ui'; ctx.textAlign='center'; ctx.fillStyle='#eaf1ff'; ctx.shadowColor='#395baf'; ctx.shadowBlur=12; ctx.fillText(text,256,76); texture.hasAlpha=true; texture.update(); return texture; }
    /** Genera una textura radial para partículas y halos. */
    function makeFlareTexture(color) { const texture = new BABYLON.DynamicTexture('flare_'+color.replace(/[^a-z0-9]/gi,'_'), 128, scene, true); const ctx=texture.getContext(); const g=ctx.createRadialGradient(64,64,2,64,64,64); g.addColorStop(0,color); g.addColorStop(.25,color); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,128,128); texture.hasAlpha=true; texture.update(); return texture; }
    /** Genera una nube de nebulosa suave con gradientes radiales. */
    function makeNebulaTexture(color1, color2) { const texture=new BABYLON.DynamicTexture('nebula_'+color1,512,scene,true); const ctx=texture.getContext(); const g=ctx.createRadialGradient(250,250,8,256,256,256); g.addColorStop(0,color1); g.addColorStop(.45,color2); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,512,512); texture.hasAlpha=true; texture.update(); return texture; }
    /** Crea el campo de 3.200 estrellas estáticas. */
    function createStars() { const stars=new BABYLON.ParticleSystem('estrellas',3200,scene); stars.particleTexture=makeFlareTexture('rgba(220,235,255,.95)'); stars.emitter=BABYLON.Vector3.Zero(); stars.minEmitBox=new BABYLON.Vector3(-1000,-1000,-1000); stars.maxEmitBox=new BABYLON.Vector3(1000,1000,1000); stars.color1=new BABYLON.Color4(.72,.82,1,1); stars.color2=new BABYLON.Color4(1,.85,.52,1); stars.colorDead=new BABYLON.Color4(1,1,1,0); stars.minSize=.3; stars.maxSize=1.5; stars.minLifeTime=999999; stars.maxLifeTime=999999; stars.emitRate=3200; stars.manualEmitCount=3200; stars.updateSpeed=0; stars.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD; stars.start(); }
    /** Crea el sol, su halo de partículas y la luz central. */
    function createSun() { sun=BABYLON.MeshBuilder.CreateSphere('Sol',{diameter:16,segments:32},scene); sunMaterial=new BABYLON.StandardMaterial('materialSol',scene); sunMaterial.disableLighting=true; sunMaterial.emissiveColor=new BABYLON.Color3(...SUN_COLORS.yellow); sunMaterial.diffuseColor=new BABYLON.Color3(.15,.05,0); sun.material=sunMaterial; const glow=BABYLON.MeshBuilder.CreateSphere('haloSolar',{diameter:20,segments:24},scene); const gm=new BABYLON.StandardMaterial('haloMaterial',scene); gm.emissiveColor=new BABYLON.Color3(1,.22,.01); gm.alpha=.12; gm.backFaceCulling=false; glow.material=gm;
      try { sunCorona=BABYLON.ParticleHelper.CreateSystem('sun', scene); sunCorona.emitter=sun; sunCorona.start(); } catch (error) { const corona=new BABYLON.ParticleSystem('coronaAlterna',700,scene); corona.particleTexture=makeFlareTexture('rgba(255,155,30,.75)'); corona.emitter=sun; corona.minEmitBox=new BABYLON.Vector3(-8,-8,-8); corona.maxEmitBox=new BABYLON.Vector3(8,8,8); corona.minSize=1; corona.maxSize=4; corona.minLifeTime=.5; corona.maxLifeTime=1.6; corona.emitRate=260; corona.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD; corona.start(); sunCorona=corona; }
    }
    /** Crea planetas, atmósferas y etiquetas desde el arreglo PLANETS. */
    function createPlanets() { PLANETS.forEach((data,index) => { const pivot=new BABYLON.TransformNode('orbita_'+data.name,scene); pivot.rotation.x=data.tilt; const mesh=BABYLON.MeshBuilder.CreateSphere(data.name,{diameter:data.size*2,segments:24},scene); const material=new BABYLON.StandardMaterial('mat_'+data.name,scene); material.diffuseColor=new BABYLON.Color3(...data.color); material.specularColor=new BABYLON.Color3(.08,.08,.08); material.emissiveColor=new BABYLON.Color3(...data.color).scale(.025); mesh.material=material; mesh.parent=pivot; mesh.position.x=data.distance*(1-data.eccentricity); mesh.rotation.z=data.tilt || .1;
        const label=BABYLON.MeshBuilder.CreatePlane('label_'+data.name,{width:9,height:2.25},scene); const lm=new BABYLON.StandardMaterial('labelMat_'+data.name,scene); lm.diffuseTexture=makeLabelTexture(data.name); lm.opacityTexture=lm.diffuseTexture; lm.useAlphaFromDiffuseTexture=true; lm.disableLighting=true; label.material=lm; label.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL; label.parent=mesh; label.position.y=data.size+2;
        if(data.atmosphere) { const atmosphere=BABYLON.MeshBuilder.CreateSphere('atmosfera_'+data.name,{diameter:data.size*2.16,segments:24},scene); const am=new BABYLON.StandardMaterial('atmosMat_'+data.name,scene); am.emissiveColor=new BABYLON.Color3(...data.atmosphere); am.alpha=.16; am.backFaceCulling=false; atmosphere.material=am; atmosphere.parent=mesh; }
        if(data.bands) { [-.7,0,.7].forEach((y,i)=>{const band=BABYLON.MeshBuilder.CreateTorus('banda'+i,{diameter:data.size*1.9,thickness:.25,tessellation:32},scene); const bm=new BABYLON.StandardMaterial('bandaMat'+i,scene); bm.emissiveColor=new BABYLON.Color3(.26,.12,.05); band.material=bm; band.parent=mesh; band.rotation.x=Math.PI/2; band.position.y=y;}); }
        if(data.hasRings) createSaturnRings(mesh,data); planets.push({data,pivot,mesh,label,phase:index*.72}); }); }
    /** Traza una órbita elíptica en el plano inclinado de cada planeta. */
    function createOrbits() { planets.forEach(({data})=>{const points=[]; for(let i=0;i<=128;i++){const a=i/128*Math.PI*2; points.push(new BABYLON.Vector3(Math.cos(a)*data.distance,Math.sin(data.tilt)*Math.sin(a)*data.distance*.25,Math.sin(a)*data.distance*(1-data.eccentricity)));} const line=BABYLON.MeshBuilder.CreateLines('trayectoria_'+data.name,{points,updatable:false},scene); line.color=new BABYLON.Color3(.20,.32,.62); line.alpha=.35; orbitLines.push(line);}); }
    /** Crea los anillos planos y translúcidos de Saturno. */
    function createSaturnRings(planet,data) { [1.5,2.15].forEach((factor,index)=>{const ring=BABYLON.MeshBuilder.CreateTorus('anilloSaturno_'+index,{diameter:data.size*factor,thickness:index?1.1:.7,tessellation:64},scene); const mat=new BABYLON.StandardMaterial('matAnillo'+index,scene); mat.diffuseColor=new BABYLON.Color3(...data.ringColor); mat.emissiveColor=mat.diffuseColor.scale(.16); mat.alpha=.58; ring.material=mat; ring.parent=planet; ring.rotation.x=Math.PI/2.08;}); }
    /** Construye el cinturón con 240 asteroides ligeros. */
    function createAsteroidBelt() { const base=BABYLON.MeshBuilder.CreateSphere('asteroideBase',{diameter:1,segments:6},scene); const mat=new BABYLON.StandardMaterial('matAsteroides',scene); mat.diffuseColor=new BABYLON.Color3(.32,.28,.25); base.material=mat; base.isVisible=false; for(let i=0;i<240;i++){const a=Math.random()*Math.PI*2,r=65+Math.random()*8;const rock=base.createInstance('asteroide_'+i);rock.position.set(Math.cos(a)*r,(Math.random()-.5)*3,Math.sin(a)*r);rock.scaling.setAll(.25+Math.random()*.65);asteroids.push({mesh:rock,phase:a,rate:.03+Math.random()*.08,radius:r});} }
    /** Crea el cometa Halley y una cola de más de 1.000 partículas. */
    function createHalley() { halley=BABYLON.MeshBuilder.CreateSphere('Halley',{diameter:1.7,segments:16},scene); const mat=new BABYLON.StandardMaterial('matHalley',scene); mat.emissiveColor=new BABYLON.Color3(.6,.9,1); mat.diffuseColor=new BABYLON.Color3(.25,.45,.6); halley.material=mat; halleyTail=new BABYLON.ParticleSystem('colaHalley',1200,scene); halleyTail.particleTexture=makeFlareTexture('rgba(165,230,255,.85)'); halleyTail.emitter=halley; halleyTail.minEmitBox=halleyTail.maxEmitBox=BABYLON.Vector3.Zero(); halleyTail.color1=new BABYLON.Color4(1,1,1,.9); halleyTail.color2=new BABYLON.Color4(.1,.65,1,.4); halleyTail.colorDead=new BABYLON.Color4(.05,.3,1,0); halleyTail.minSize=.25; halleyTail.maxSize=1.15; halleyTail.minLifeTime=.8; halleyTail.maxLifeTime=2.2; halleyTail.emitRate=900; halleyTail.updateSpeed=.018; halleyTail.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD; halleyTail.start(); }
    /** Coloca cuatro nebulosas lejanas de textura procedural. */
    function createNebulas() { [['rgba(235,80,177,.48)','rgba(77,62,225,.10)'],['rgba(80,130,255,.42)','rgba(86,25,150,.08)'],['rgba(255,91,138,.36)','rgba(55,79,240,.05)'],['rgba(56,203,235,.32)','rgba(82,31,141,.05)']].forEach((colors,i)=>{const a=i*Math.PI/2+.4, plane=BABYLON.MeshBuilder.CreatePlane('nebulosa_'+i,{size:500},scene);plane.position.set(Math.cos(a)*1550,(i-1.5)*240,Math.sin(a)*1550);plane.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;const material=new BABYLON.StandardMaterial('matNebula_'+i,scene);material.diffuseTexture=makeNebulaTexture(...colors);material.opacityTexture=material.diffuseTexture;material.emissiveColor=new BABYLON.Color3(1,1,1);material.disableLighting=true;material.useAlphaFromDiffuseTexture=true;plane.material=material;nebulas.push(plane);}); }
    /** Configura postprocesado sin impedir que la escena funcione si falla. */
    function setupPostProcessing() { try { bloomPipeline=new BABYLON.DefaultRenderingPipeline('postProceso',true,scene,[camera]); bloomPipeline.bloomEnabled=true; bloomPipeline.bloomThreshold=.2; bloomPipeline.bloomWeight=.45; bloomPipeline.bloomKernel=64; bloomPipeline.imageProcessingEnabled=true; bloomPipeline.imageProcessing.toneMappingEnabled=true; glowLayer=new BABYLON.GlowLayer('resplandor',scene,{blurKernelSize:48}); glowLayer.intensity=.55; } catch(error) { bloomPipeline=null; glowLayer=null; } }
    /** Conecta el panel de control con los objetos de la escena. */
    function setupUI() { const byId=id=>document.getElementById(id), setOutput=(id,value)=>byId(id).textContent=value+'x'; byId('globalSpeed').addEventListener('input',e=>{state.globalSpeed=+e.target.value;setOutput('globalSpeedValue',state.globalSpeed.toFixed(1));}); byId('orbitSpeed').addEventListener('input',e=>{state.orbitSpeed=+e.target.value;setOutput('orbitSpeedValue',state.orbitSpeed.toFixed(1));}); byId('pauseButton').addEventListener('click',e=>{state.paused=!state.paused;e.target.textContent=state.paused?'Reanudar simulación':'Pausar simulación';});
      byId('showOrbits').addEventListener('change',e=>orbitLines.forEach(line=>line.isVisible=e.target.checked));byId('showLabels').addEventListener('change',e=>planets.forEach(p=>p.label.isVisible=e.target.checked));byId('showHalley').addEventListener('change',e=>{halley.isVisible=e.target.checked;});byId('showTail').addEventListener('change',e=>{if(e.target.checked) halleyTail.start(); else halleyTail.stop();});byId('showAsteroids').addEventListener('change',e=>asteroids.forEach(a=>a.mesh.isVisible=e.target.checked));byId('showNebulas').addEventListener('change',e=>nebulas.forEach(n=>n.isVisible=e.target.checked));
      byId('planetScale').addEventListener('input',e=>{state.size=+e.target.value;setOutput('planetScaleValue',state.size.toFixed(1));planets.forEach(p=>p.mesh.scaling.setAll(state.size));});byId('theme').addEventListener('change',e=>document.body.className=e.target.value==='futuristic'?'':e.target.value);byId('showBloom').addEventListener('change',e=>{if(bloomPipeline)bloomPipeline.bloomEnabled=e.target.checked;if(glowLayer)glowLayer.isEnabled=e.target.checked;});byId('sunColor').addEventListener('change',e=>{sunMaterial.emissiveColor=new BABYLON.Color3(...SUN_COLORS[e.target.value]);});
      byId('cameraView').addEventListener('change',e=>{const options={system:[180,BABYLON.Vector3.Zero()],sun:[36,BABYLON.Vector3.Zero()],earth:[22,planets[2].mesh.getAbsolutePosition()],saturn:[30,planets[5].mesh.getAbsolutePosition()],panorama:[500,BABYLON.Vector3.Zero()],halley:[35,halley.position]};const [radius,target]=options[e.target.value];camera.radius=radius;camera.setTarget(target);state.followHalley=e.target.value==='halley';}); }
    createStars(); createSun(); createPlanets(); createOrbits(); createAsteroidBelt(); createHalley(); createNebulas(); setupPostProcessing(); setupUI();
    /** Actualiza órbitas, rotaciones y la cola del cometa con deltaTime. */
    scene.onBeforeRenderObservable.add(()=>{const dt=engine.getDeltaTime()/1000;if(!state.paused){const t=performance.now()/1000;sun.rotation.y+=dt*.15*state.globalSpeed;const pulse=1+Math.sin(t*Math.PI*2/3)*.025;sun.scaling.setAll(pulse);planets.forEach(p=>{p.phase+=dt*p.data.speed*.36*state.globalSpeed*state.orbitSpeed;p.pivot.rotation.y=p.phase;p.mesh.rotation.y+=dt*1.5*state.globalSpeed*(p.data.speed<0?-1:1);});asteroids.forEach(a=>{a.phase+=dt*a.rate*state.globalSpeed;a.mesh.position.x=Math.cos(a.phase)*a.radius;a.mesh.position.z=Math.sin(a.phase)*a.radius;a.mesh.rotation.x+=dt;});const phase=t*(Math.PI*2/18)*state.globalSpeed;const e=.85,a=170,r=a*(1-e*e)/(1+e*Math.cos(phase));halley.position.set(Math.cos(phase)*r,Math.sin(phase*.7)*12,Math.sin(phase)*r*.54);const away=halley.position.clone().normalize();halleyTail.direction1=away.scale(5);halleyTail.direction2=away.scale(14);if(state.followHalley)camera.setTarget(halley.position);}
      document.getElementById('fps').textContent=engine.getFps().toFixed(0)+' FPS';document.getElementById('objects').textContent=scene.meshes.length+' objetos';});
    engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());
  })();
  </script>
</body>
</html>
